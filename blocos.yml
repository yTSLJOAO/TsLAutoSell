# Como adicionar um bloco novo:
# 1. Copie um dos blocos acima (com o mesmo recuo/indentação)
# 2. Dê um nome único pra ele (a chave, ex: "Lapis")
# 3. "bloco" = o Material do Bukkit do BLOCO em si (ex: LAPIS_ORE)
# 4. "item" = o Material do ITEM que realmente dropa ao quebrar (ex: LAPIS_ORE dropa INK_SACK com data 4 no 1.8).
#    Se o bloco dropar ele mesmo (ex: madeira, terra), pode omitir "item" que ele usa o mesmo valor de "bloco".
# 5. "data" = data value do BLOCO (use -1 se não precisar diferenciar, ou o valor exato, ex: lã colorida)
# 6. "Valor" = quanto de dinheiro o jogador recebe por bloco quebrado
# 7. "Mensagem(ActionBar)" = mensagem mostrada na ActionBar, use %valor_adquirido% pro valor formatado

